apiVersion: v1
kind: Secret
metadata:
  name: {{ include "unified-decision-gate.fullname" . }}-secret
  labels:
    {{- include "unified-decision-gate.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ required "agent.openaiApiKey is required" .Values.agent.openaiApiKey | quote }}
  # The platform Redis needs auth, so its URL carries the password: a secret, not config.
  REDIS_URL: {{ .Values.redisUrl | quote }}
  DEVUI_AUTH_TOKEN: {{ required "agent.devuiAuthToken is required" .Values.agent.devuiAuthToken | quote }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.agent.langfusePublicKey | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.agent.langfuseSecretKey | quote }}
{{- if .Values.gate.enabled }}
---
# Kept apart from the agent's secret, which the agent loads whole via envFrom: these are for
# the gate only: its GATE_TELEMETRY_HASH_KEY, and the System-1 vLLM's --api-key if it has one.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "unified-decision-gate.fullname" . }}-gate-secret
  labels:
    {{- include "unified-decision-gate.labels" . | nindent 4 }}
type: Opaque
stringData:
  GATE_TELEMETRY_HASH_KEY: {{ .Values.gate.telemetryHashKey | quote }}
  SYSTEM1_API_KEY: {{ .Values.gate.system1ApiKey | quote }}
{{- end }}

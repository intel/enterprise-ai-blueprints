apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coding-agent.fullname" . }}-secret
  labels:
    {{- include "coding-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ required "agent.openaiApiKey is required" .Values.agent.openaiApiKey | quote }}
  DEVUI_AUTH_TOKEN: {{ required "agent.devuiAuthToken is required" .Values.agent.devuiAuthToken | quote }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.agent.langfusePublicKey | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.agent.langfuseSecretKey | quote }}
  # Router bearer token (only needed when the router requires auth; empty is fine).
  SANDBOX_ROUTER_TOKEN: {{ .Values.agent.sandboxRouterToken | quote }}

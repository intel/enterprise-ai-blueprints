{{- include "coding-agent.validateRedis" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coding-agent.fullname" . }}-config
  labels:
    {{- include "coding-agent.labels" . | nindent 4 }}
data:
  OPENAI_BASE_URL: {{ .Values.agent.openaiBaseUrl | quote }}
  LANGFUSE_HOST: {{ .Values.agent.langfuseHost | quote }}
  LANGFUSE_ENABLE_SENSITIVE_DATA: {{ .Values.agent.langfuseEnableSensitiveData | quote }}
  MODEL_NAME: {{ .Values.agent.modelName | quote }}
  OPENAI_MODEL: {{ .Values.agent.modelName | quote }}
  OPENAI_CHAT_COMPLETION_MODEL: {{ .Values.agent.modelName | quote }}
  # If redisUrl is provided, use it; otherwise use the bundled Redis subchart service.
  {{- if .Values.redisUrl }}
  REDIS_URL: {{ .Values.redisUrl | quote }}
  {{- else }}
  REDIS_URL: "redis://redis-stack-server:6379"
  {{- end }}
  WORKSPACE_DIR: {{ .Values.agent.workspaceDir | quote }}
  SANDBOX_NAMESPACE: {{ .Values.agent.sandboxNamespace | quote }}
  SANDBOX_TEMPLATE: {{ .Values.agent.sandboxTemplate | quote }}
  SANDBOX_WARMPOOL: {{ .Values.agent.sandboxWarmPool | quote }}
  SANDBOX_ROUTER_URL: {{ .Values.agent.sandboxRouterUrl | quote }}
  AUTO_OPEN_BROWSER: "false"
  PYTHONUNBUFFERED: "1"
  no_proxy: {{ .Values.agent.noProxy | quote }}
  NO_PROXY: {{ .Values.agent.noProxy | quote }}
  RAY_ENABLED: {{ .Values.ray.enabled | quote }}
  RAY_ADDRESS: {{ .Values.ray.address | quote }}

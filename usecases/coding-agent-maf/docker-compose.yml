# Coding Agent — Local Development Stack
# Runs the agent + Redis without Kubernetes.
# Set LITELLM_URL and LITELLM_API_KEY to point at your running LiteLLM gateway —
# on AI Solutions that is https://litellm.<base_domain_name>/v1 with a LiteLLM
# (virtual or master) key; the host must resolve to the eg-gateway IP and trust
# its CA (env/<env>/logs/ai-solutions-ca.crt).
#
# Usage:
#   export LITELLM_URL=https://litellm.solutions.ai/v1
#   export LITELLM_API_KEY=sk-your-key
#   export MODEL_NAME=qwen2-5-coder-14b   # must support tool calling
#   # Proxy values (http_proxy, https_proxy, no_proxy) are read from your shell env.
#   docker compose up --build

services:

  coding-agent:
    image: coding-agent:latest        # built by deploy.sh, or build locally below
    build:
      context: ./src
      dockerfile: Dockerfile
      args:
        http_proxy: "${http_proxy:-}"
        https_proxy: "${https_proxy:-}"
        no_proxy: "${no_proxy:-}"
        HTTP_PROXY: "${HTTP_PROXY:-${http_proxy:-}}"
        HTTPS_PROXY: "${HTTPS_PROXY:-${https_proxy:-}}"
        NO_PROXY: "${NO_PROXY:-${no_proxy:-}}"
    container_name: coding-agent
    cap_drop:
      - ALL
    ports:
      - "8090:8090"
    environment:
      OPENAI_BASE_URL: "${LITELLM_URL:-http://host.docker.internal:4000/v1}"
      OPENAI_API_KEY: "${LITELLM_API_KEY:-sk-placeholder}"
      MODEL_NAME: "${MODEL_NAME:-qwen2-5-coder-14b}"
      REDIS_URL: "redis://redis-stack:6379"
      WORKSPACE_DIR: "/app/workspace"
      SANDBOX_NAMESPACE: "${SANDBOX_NAMESPACE:-agent-sandbox-system}"
      SANDBOX_TEMPLATE: "${SANDBOX_TEMPLATE:-python-sandbox-template}"
      SANDBOX_ROUTER_URL: "${SANDBOX_ROUTER_URL:-http://sandbox-router-svc.agent-sandbox-system.svc.cluster.local:8080}"
      http_proxy: "${http_proxy:-}"
      https_proxy: "${https_proxy:-}"
      no_proxy: "${no_proxy:-}"
      HTTP_PROXY: "${HTTP_PROXY:-${http_proxy:-}}"
      HTTPS_PROXY: "${HTTPS_PROXY:-${https_proxy:-}}"
      NO_PROXY: "${NO_PROXY:-${no_proxy:-}}"
    volumes:
      - coding-agent-workspace:/app/workspace
    depends_on:
      redis-stack:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  redis-stack:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: coding-agent-redis
    cap_drop:
      - ALL
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  coding-agent-workspace:
  redis-data:

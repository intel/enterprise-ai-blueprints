{{- if .Values.httpRoute.enabled }}
# Exposes the DevUI through the platform's Envoy Gateway (Gateway API).
# TLS is terminated at the gateway's https listener (*.<base_domain_name>).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "banking-assistant.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "banking-assistant.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.httpRoute.gateway.name }}
      namespace: {{ .Values.httpRoute.gateway.namespace }}
      {{- with .Values.httpRoute.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .Values.httpRoute.host }}
  hostnames:
    - {{ . | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.path }}
      backendRefs:
        - name: {{ include "banking-assistant.fullname" . }}
          port: {{ .Values.agent.service.port }}
{{- end }}

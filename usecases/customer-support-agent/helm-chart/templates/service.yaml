apiVersion: v1
kind: Service
metadata:
  name: {{ include "customer-support-agent.fullname" . }}
  labels:
    {{- include "customer-support-agent.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - name: streamlit
      port: {{ .Values.agent.streamlitPort }}
      targetPort: streamlit
      protocol: TCP
      {{- if and (eq (.Values.service.type | default "ClusterIP") "NodePort") .Values.service.streamlitNodePort }}
      nodePort: {{ .Values.service.streamlitNodePort }}
      {{- end }}
    - name: api
      port: {{ .Values.agent.apiPort }}
      targetPort: api
      protocol: TCP
      {{- if and (eq (.Values.service.type | default "ClusterIP") "NodePort") .Values.service.apiNodePort }}
      nodePort: {{ .Values.service.apiNodePort }}
      {{- end }}
  selector:
    {{- include "customer-support-agent.selectorLabels" . | nindent 4 }}

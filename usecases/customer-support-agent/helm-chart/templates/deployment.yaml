apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "customer-support-agent.fullname" . }}
  labels:
    {{- include "customer-support-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.agent.replicaCount }}
  selector:
    matchLabels:
      {{- include "customer-support-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "customer-support-agent.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll pods automatically when the config/secret content changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      # Pod Security Standard 'restricted' (AI Solutions enforces PSS). UID/GID
      # 10001 matches the numeric user baked into the image (Dockerfile).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          ports:
            - name: streamlit
              containerPort: {{ .Values.agent.streamlitPort }}
              protocol: TCP
            - name: api
              containerPort: {{ .Values.agent.apiPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "customer-support-agent.fullname" . }}-config
            - secretRef:
                name: {{ include "customer-support-agent.fullname" . }}-secret
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: api
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: {{ .Values.agent.dataDir }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          emptyDir: {}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "deep-research-agent.serviceAccountName" . }}
  labels:
    {{- include "deep-research-agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The agent needs no Kubernetes API access — it only talks to the LLM endpoint
# and the search APIs over HTTP.
automountServiceAccountToken: false
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deep-research-agent.fullname" . }}-secret
  labels:
    {{- include "deep-research-agent.labels" . | nindent 4 }}
type: Opaque
data:
  LLM_API_KEY: {{ .Values.agent.llm.apiKey | b64enc | quote }}
  SECONDARY_LLM_API_KEY: {{ .Values.agent.secondaryLlm.apiKey | b64enc | quote }}
  TAVILY_API_KEY: {{ .Values.agent.search.tavilyApiKey | b64enc | quote }}
  SERPER_API_KEY: {{ .Values.agent.search.serperApiKey | b64enc | quote }}
  API_KEYS: {{ .Values.agent.apiKeys | b64enc | quote }}
